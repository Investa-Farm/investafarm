services:
  - type: web
    name: investa-farm
    runtime: node
    plan: free
    # Use Node 20 (consistent with project's pnpm-workspace.yaml target)
    nodeVersion: "20"
    # Skip the minimumReleaseAge registry check (pnpm-workspace.yaml sets this to
    # 1440 min for supply-chain safety, but it adds ~479 extra npm registry calls
    # on a cold Render build — safe to skip here because --frozen-lockfile already
    # pins exact versions from the audited lockfile).
    buildCommand: >-
      pnpm config set minimumReleaseAge 0 &&
      pnpm install --frozen-lockfile &&
      NODE_ENV=production pnpm --filter @workspace/investa-farm run build &&
      NODE_ENV=production pnpm --filter @workspace/api-server run build
    startCommand: node artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CIRCLE_API_KEY
        sync: false
      - key: DARAJA_CONSUMER_KEY
        sync: false
      - key: DARAJA_CONSUMER_SECRET
        sync: false
      - key: GNEWS_API_KEY
        sync: false
      - key: MEDIASTACK_API_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: "Investa Farm <onboarding@app.investafarm.com>"
      - key: STELLAR_ISSUER_PUBLIC_KEY
        sync: false
      - key: STRIPE_PUBLIC_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://app.investafarm.com"
      - key: SESSION_SECRET
        sync: false
